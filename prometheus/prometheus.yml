global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "nexus-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
        labels:
          tier: "victim-service"
          service: "fastapi-cluster"

  - job_name: "nexus-healer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["recovery:5050"]
        labels:
          tier: "recovery-agent"
          service: "nexus-healer"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
