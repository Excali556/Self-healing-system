services:
  app:
    build: ./app
    ports:
      - "8000-8002:8000"
    restart: always

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  chaos:
    build: ./chaos
    container_name: chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app

  healer:
    build: ./recovery
    container_name: healer
    volumes:

      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app
