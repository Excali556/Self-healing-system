name: Nexus CI - Resilience & Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r recovery/requirements.txt
          pip install -r chaos/requirements.txt
          pip install pytest pytest-cov matplotlib numpy

      - name: Run Test Suite
        env:
          TESTING: "true"
          ENABLE_HEALING_DAEMON: "false"
        run: |
          python -m pytest tests/ -v --cov=app --cov=recovery --cov=chaos --cov-report=term-missing

      - name: Verify Benchmark Script Execution
        run: |
          python scripts/benchmark_resilience.py --duration 30

  docker-build:
    name: Docker Compose Validation & Image Builds
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: actions/docker/setup-buildx-action@v3

      - name: Build Victim Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: nexus-app:latest

      - name: Build Autonomous Healer Image
        uses: docker/build-push-action@v5
        with:
          context: ./recovery
          push: false
          tags: nexus-healer:latest

      - name: Build Chaos Monkey Image
        uses: docker/build-push-action@v5
        with:
          context: ./chaos
          push: false
          tags: nexus-chaos:latest

      - name: Build Streamlit Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: ./Dashboard
          push: false
          tags: nexus-dashboard:latest
